baseURL = "https://cms-opendata-workshop.github.io/tutorial-lesson-full-simulation-cloud-infomaniak/"
title = "Simulation Workflow Tutorial"
locale = "en-US"
enableGitInfo = true
disableKinds = ["taxonomy", "term", "RSS"]

[module]
  [[module.imports]]
    path = "github.com/oer-particle-physics/hugo-styles"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
    [[module.imports.mounts]]
      source = "package.json"
      target = "assets/_jsconfig/package.json"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"]]
    [markup.goldmark.renderer]
      unsafe = true

[params.lesson]
  title = "Simulation Workflow Tutorial"
  tagline = "Instructions on how to simulate a collision dataset using an automated workflow."
  description = "Using Public Cloud resources, simulate your own dataset by running Argo Workflows on a Kubernetes cluster."
  contact = "team@example.org"
  repo = "https://github.com/cms-opendata-workshop/tutorial-lesson-full-simulation-cloud-infomaniak"
  docsRepo = "https://github.com/cms-opendata-workshop/tutorial-lesson-full-simulation-cloud-infomaniak"
  editBranch = "main"
  copyrightHolder = "the authors"
  licenseName = "CC BY 4.0"
  licenseURL = "https://creativecommons.org/licenses/by/4.0/"
  lifecycle = "alpha"
  defaultView = "learner"
  enableSidebarNumbering = true

[params.navbar]
  displayTitle = true
  displayLogo = false

[params.search]
  enable = true
  type = "flexsearch"

  [params.search.flexsearch]
    index = "content"
    js = "js/vendor/flexsearch.bundle.min.js"
    maxPageResults = 12
    maxSectionResults = 8

[params.page.tabs]
  sync = true

[params.footer]
  displayPoweredBy = false
  displayCopyright = false

[params.versioning]
  enable = true
  defaultBranch = "main"
  menuName = "Versions"
  menuIdentifier = "versions"
  menuWeight = 70

  [params.versioning.latest]
    enable = true
    label = "Latest"

  [params.versioning.branches]
    refs = []
    patterns = []
    all = false

  [params.versioning.tags]
    refs = []
    patterns = []
    all = false

[menus]
  [[menus.main]]
    name = "Setup"
    pageRef = "/learners/setup"
    weight = 5
  [[menus.main]]
    name = "Episodes"
    pageRef = "/episodes"
    weight = 10
  [[menus.main]]
    name = "Summaries"
    identifier = "resources"
    weight = 30
  [[menus.main]]
    name = "Key Points"
    parent = "resources"
    pageRef = "/key-points"
    weight = 10
  [[menus.main]]
    name = "All-in-One"
    parent = "resources"
    pageRef = "/all-in-one"
    weight = 20
  [[menus.main]]
    name = "External Links"
    parent = "resources"
    pageRef = "/external-links"
    weight = 25
  [[menus.main]]
    name = "All Images"
    parent = "resources"
    pageRef = "/extract-all-images"
    weight = 60
  [[menus.main]]
    name = "Search"
    weight = 80
    [menus.main.params]
      type = "search"
  [[menus.main]]
    name = "GitHub"
    url = "https://github.com/cms-opendata-workshop/tutorial-lesson-full-simulation-cloud-infomaniak"
    weight = 90
    [menus.main.params]
      icon = "github"